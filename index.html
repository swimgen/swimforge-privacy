<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Swimforge — Legal</title>
<meta name="description" content="Legal documents for the Swimforge Android application.">
<style>
  :root { --deep:#0A2540; --aqua:#0E7FA6; --cyan:#07B5C7;
          --bg:#fff; --fg:#1b2733; --rule:#dde5ec; --card:#f4f8fb; --muted:#5a6b7c; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#0b1622; --fg:#e3ecf4; --rule:#1f3245; --card:#122334; --muted:#9fb1c2; --deep:#8fd4e8; }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font-size:17px; line-height:1.65;
         font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; }
  header { background:linear-gradient(135deg,#0A2540 0%,#0E7FA6 60%,#07B5C7 100%);
           color:#fff; padding:52px 16px 44px; }
  header .inner { max-width:760px; margin:0 auto; }
  header p.kicker { margin:0 0 8px; text-transform:uppercase; letter-spacing:.16em; font-size:12px; opacity:.85; }
  header h1 { margin:0; font-size:32px; }
  main { max-width:760px; margin:0 auto; padding:36px 16px 80px; }
  a.card { display:block; text-decoration:none; color:inherit; background:var(--card);
           border:1px solid var(--rule); border-left:4px solid var(--cyan);
           border-radius:8px; padding:18px 20px; margin-bottom:14px; }
  a.card:hover { border-left-color: var(--aqua); }
  a.card strong { display:block; font-size:18px; color:var(--deep); margin-bottom:3px; }
  a.card span { font-size:15px; color:var(--muted); }
  footer { max-width:760px; margin:0 auto; padding:0 16px 60px; font-size:14px; color:var(--muted); }
  @media (max-width:480px){ header h1{font-size:25px;} }
</style>
</head>
<body>
<header><div class="inner">
  <p class="kicker">Swimforge</p>
  <h1>Legal &amp; privacy</h1>
</div></header>
<main>
  <a class="card" href="./privacy_policy_en.html">
    <strong>Privacy Policy</strong><span>English — version 1.0, 26 October 2026</span>
  </a>
  <a class="card" href="./privacy_policy_fr.html">
    <strong>Politique de confidentialit&eacute;</strong><span>Fran&ccedil;ais — version 1.0, 26 octobre 2026</span>
  </a>
</main>
<footer>Swimforge — Android application, package <code>com.swimforge.app</code>.</footer>
</body>
</html>
